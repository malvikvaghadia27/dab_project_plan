name: Databricks Asset Bundles CI

on:
  push:
    branches:
      - 'feature/*'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:    # lets you manually kick it off for testing

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies + pytest-html
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pyspark.txt
          pip install pytest-html

      - name: Run pytest & generate HTML report
        run: |
          pytest \
            --maxfail=1 \
            --disable-warnings \
            --junitxml=pytest-results.xml \
            --html=pytest-report.html \
            --self-contained-html

      - name: Upload pytest JUnit XML
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: pytest-results.xml

      - name: Upload pytest HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: pytest-report.html